appId: ${APP_ID}
name: 'e2e: app launches and shows the home screen'
---
- launchApp:
    clearState: true
# clearState reinstalls the app on iOS, and a freshly installed build on a
# hosted simulator took up to 30 seconds to show its first screen after
# launchApp returned (measured 2026-10-04). The wait ends as soon as the text
# shows, so a long timeout costs a passing run nothing.
- extendedWaitUntil:
    visible: 'Daily store checklist'
    timeout: 120000
