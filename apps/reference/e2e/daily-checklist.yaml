appId: ${APP_ID}
name: 'e2e: manager completes the daily checklist'
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: '0 of 5 done'
    timeout: 30000
- tapOn: 'Open the safe'
- assertVisible: '1 of 5 done'
- tapOn: 'Check the fridge temperatures'
- assertVisible: '2 of 5 done'
- tapOn: 'Count the float'
- assertVisible: '3 of 5 done'
- tapOn: 'Review the roster'
- assertVisible: '4 of 5 done'
- tapOn: 'Check the fire exits'
- assertVisible: '5 of 5 done'
