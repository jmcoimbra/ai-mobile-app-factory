appId: ${APP_ID}
name: 'e2e: manager completes the daily checklist'
---
- launchApp:
    clearState: true
# A hosted iOS simulator stalls for long stretches (measured 2026-10-04): a
# freshly installed build took up to 30 seconds to show the checklist after
# launchApp returned, and once the app sat 65 seconds waiting on the system
# after a tap before it counted the task. Each wait ends as soon as the text
# shows, so a long timeout costs a passing run nothing.
- extendedWaitUntil:
    visible: '0 of 5 done'
    timeout: 120000
- tapOn: 'Open the safe'
- extendedWaitUntil:
    visible: '1 of 5 done'
    timeout: 120000
- tapOn: 'Check the fridge temperatures'
- extendedWaitUntil:
    visible: '2 of 5 done'
    timeout: 120000
- tapOn: 'Count the float'
- extendedWaitUntil:
    visible: '3 of 5 done'
    timeout: 120000
- tapOn: 'Review the roster'
- extendedWaitUntil:
    visible: '4 of 5 done'
    timeout: 120000
- tapOn: 'Check the fire exits'
- extendedWaitUntil:
    visible: '5 of 5 done'
    timeout: 120000
